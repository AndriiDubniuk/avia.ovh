name: deploy-avia-ovh

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/ubuntu/avia.ovh

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      web_image: ${{ steps.meta.outputs.web_image }}
      api_image: ${{ steps.meta.outputs.api_image }}
      billing_image: ${{ steps.meta.outputs.billing_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          SHA_SHORT="${GITHUB_SHA::12}"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${OWNER_LC}/avia-ovh-web:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${OWNER_LC}/avia-ovh-api:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "billing_image=ghcr.io/${OWNER_LC}/avia-ovh-billing:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_image }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_image }}

      - name: Build and push billing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/billing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.billing_image }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime env files
        shell: bash
        run: |
          cat > .env.production <<EOF
          APP_DOMAIN=avia.ovh
          BILLING_DOMAIN=billing.avia.ovh
          APP_ENV=production
          DB_PORT=5432
          DB_USER=avia
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=avia_agro
          DB_SSL=false
          TYPEORM_SYNCHRONIZE=true
          WEB_IMAGE_REF=${{ needs.build.outputs.web_image }}
          API_IMAGE_REF=${{ needs.build.outputs.api_image }}
          BILLING_IMAGE_REF=${{ needs.build.outputs.billing_image }}
          EOF

          mkdir -p apps/web apps/api apps/billing

          cat > apps/web/.env.production <<EOF
          NEXT_PUBLIC_SITE_URL=https://avia.ovh
          NEXT_PUBLIC_API_BASE_URL=/api
          NEXT_PUBLIC_BILLING_URL=https://billing.avia.ovh
          NEXT_PUBLIC_LANDING_URL=https://avia.ovh
          EOF

          cat > apps/billing/.env.production <<EOF
          NEXT_PUBLIC_SITE_URL=https://billing.avia.ovh
          NEXT_PUBLIC_API_BASE_URL=/api
          NEXT_PUBLIC_LANDING_URL=https://avia.ovh
          BILLING_PRIVATE_MODE=true
          EOF

          cat > apps/api/.env.production <<EOF
          APP_ENV=production
          PORT=3001
          FRONTEND_ORIGIN=https://avia.ovh,https://www.avia.ovh,https://billing.avia.ovh
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=avia
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=avia_agro
          DB_SSL=false
          TYPEORM_SYNCHRONIZE=true
          BILLING_PUBLIC_URL=https://billing.avia.ovh
          BILLING_PUBLIC_API_URL=https://billing.avia.ovh/api
          BILLING_PRIVATE_MODE=true
          MONOBANK_API_BASE_URL=https://api.monobank.ua
          MONOBANK_MODE=real
          MONOBANK_WEBHOOK_URL=https://billing.avia.ovh/api/v1/billing/webhooks/monobank
          MONOBANK_TOKEN=${{ secrets.MONOBANK_TOKEN }}
          MONOBANK_ACQUIRING_TOKEN=${{ secrets.MONOBANK_ACQUIRING_TOKEN }}
          IDEMPOTENCY_TTL_HOURS=72
          BILLING_PLANS_JSON=${{ secrets.BILLING_PLANS_JSON }}
          BILLING_PORTAL_MAGIC_TTL_MINUTES=15
          BILLING_PORTAL_SESSION_TTL_HOURS=24
          BILLING_PORTAL_COOKIE_NAME=billing_portal_session
          BILLING_PERSONAL_LINK_BASE_URL=https://billing.avia.ovh/pay
          BILLING_PERSONAL_LINK_TTL_HOURS=72
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          BILLING_NOTIFICATION_TO_EMAIL=${{ secrets.BILLING_NOTIFICATION_TO_EMAIL }}
          TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}
          EOF

      - name: Prepare SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p '${DEPLOY_PATH}' '${DEPLOY_PATH}/apps/web' '${DEPLOY_PATH}/apps/api' '${DEPLOY_PATH}/apps/billing'"

      - name: Sync deploy files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'dist/' \
            --exclude 'output/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Deploy on VPS
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          BACKUP_SUFFIX="\$(date +%Y%m%d%H%M%S)"
          cp .env.production ".env.production.bak.\${BACKUP_SUFFIX}" || true

          docker compose --env-file .env.production -f docker-compose.deploy.yml config >/dev/null
          docker compose --env-file .env.production -f docker-compose.deploy.yml pull web api billing
          docker compose --env-file .env.production -f docker-compose.deploy.yml up -d postgres
          docker compose --env-file .env.production -f docker-compose.deploy.yml up -d api
          docker compose --env-file .env.production -f docker-compose.deploy.yml up -d web billing

          check_url() {
            local host="\$1"
            local path="\$2"
            local attempts=30
            local delay=5

            for i in \$(seq 1 "\$attempts"); do
              if curl -fsS -H "Host: \${host}" "http://127.0.0.1\${path}" >/dev/null; then
                echo "Health check passed: host=\${host} path=\${path}"
                return 0
              fi
              echo "Health check retry \${i}/\${attempts}: host=\${host} path=\${path}"
              sleep "\$delay"
            done

            echo "Health check failed: host=\${host} path=\${path}"
            return 1
          }

          if ! check_url "avia.ovh" "/health" || ! check_url "avia.ovh" "/api/v1/health" || ! check_url "billing.avia.ovh" "/health"; then
            if [ -f ".env.production.bak.\${BACKUP_SUFFIX}" ]; then
              cp ".env.production.bak.\${BACKUP_SUFFIX}" .env.production
              docker compose --env-file .env.production -f docker-compose.deploy.yml up -d web api billing
            fi
            exit 1
          fi
          EOF
